name: Android CI

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches-ignore:
      - 'wip/**'
  workflow_dispatch:

jobs:
  cleanupArtifacts:
    name: Clean up old artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts (keep only 5 most recent)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            artifacts.artifacts.sort((a, b) =>
              new Date(b.created_at) - new Date(a.created_at)
            );

            const toDelete = artifacts.artifacts.slice(5);

            console.log(`Total artifacts: ${artifacts.artifacts.length}`);
            console.log(`Keeping: ${Math.min(artifacts.artifacts.length, 5)}`);
            console.log(`Deleting: ${toDelete.length}`);

            for (const artifact of toDelete) {
              console.log(`Deleting: ${artifact.name} (created: ${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

  build:
    name: Build APKs
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Successfully generated app/google-services.json from secret."
          else
            echo '{"project_info":{"project_number":"000000000000","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"pro.sketchware"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
            echo "Generated dummy app/google-services.json fallback."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=1 assembleRelease

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APK with commit hash
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

  publishRelease:
    name: Publish APK to GitHub Releases
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./release-assets

      - name: Set release metadata
        id: release_meta
        shell: bash
        run: |
          release_tag="main-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.build.outputs.short_sha }}"
          asset_name="Sketchware-IA-main-${{ needs.build.outputs.short_sha }}-run${{ github.run_number }}.apk"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

          cp ./release-assets/app-release-${{ needs.build.outputs.short_sha }}.apk \
             "./release-assets/${asset_name}"

      - name: Write release notes
        shell: bash
        run: |
          cat <<EOF > release-notes.md
          Automated development build for commit \`${{ needs.build.outputs.short_sha }}\`.

          - Branch: \`${{ github.ref_name }}\`
          - Commit: \`${{ github.sha }}\`
          - Run number: \`${{ github.run_number }}\`
          - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This prerelease was generated automatically from the latest successful CI build for this run on \`main\`.
          EOF

      - name: Create release for this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.release_meta.outputs.release_tag }}" \
            -R "${GITHUB_REPOSITORY}" \
            "./release-assets/${{ steps.release_meta.outputs.asset_name }}" \
            --title "Development Build #${{ github.run_number }} (${{ needs.build.outputs.short_sha }})" \
            --notes-file release-notes.md \
            --latest \
            --target "${GITHUB_SHA}"

  cleanupReleases:
    name: Clean up old releases
    runs-on: ubuntu-latest
    needs: publishRelease
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Delete old releases (keep only 5 most recent)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            releases.sort((a, b) =>
              new Date(b.created_at) - new Date(a.created_at)
            );

            const toDelete = releases.slice(5);

            console.log(`Total releases: ${releases.length}`);
            console.log(`Keeping: ${Math.min(releases.length, 5)}`);
            console.log(`Deleting: ${toDelete.length}`);

            for (const release of toDelete) {
              console.log(`Deleting release: ${release.tag_name} (created: ${release.created_at})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
            }

  updateAppData:
    name: Update App Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Update App Script
        run: python .github/workflows/update_app_data.py

      - name: Commit and Push Changes
        env:
          GH_ABOUT_APP_WORKFLOW_TOKEN: ${{ secrets.GH_ABOUT_APP_WORKFLOW_TOKEN }}
        run: |
          git checkout host
          git config --global user.name "Sketchware Pro Actions"
          git config --global user.email "hello@sketchware.pro"
          git add about.json
          git commit -m "feat: Update app about screen data"
          git push
        continue-on-error: true
