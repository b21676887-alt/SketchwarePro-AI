name: Extract Backup Zip

on:
  push:
    branches:
      - '**' # يعمل عند الرفع على أي فرع (main, dev, إلخ)
    paths:
      - '**/backup.zip' # يعمل سواء كان الملف في الجذر أو داخل مجلد فرعي
  workflow_dispatch:

jobs:
  extract:
    name: Extract Backup File
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Unzip Backup File
        run: |
          # البحث عن الملف وفك ضغطه أينما وجد
          ZIP_FILE=$(find . -maxdepth 2 -name "backup.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            TARGET_DIR=$(dirname "$ZIP_FILE")
            echo "Unzipping $ZIP_FILE into $TARGET_DIR..."
            unzip -o "$ZIP_FILE" -d "$TARGET_DIR"
            rm "$ZIP_FILE"
            echo "Unzipped successfully and removed backup.zip"
          else
            echo "Warning: backup.zip not found in workspace."
          fi

      - name: Commit and Push Unzipped Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore: Extract backup.zip contents [skip ci]" || echo "No changes to commit"
          git push
