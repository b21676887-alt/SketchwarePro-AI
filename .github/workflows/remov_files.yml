name: Delete Specific Resource Icons

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  delete-files:
    name: Delete Resource Icons
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Target Files
        run: |
          # قائمة بالملفات المراد حذفها
          FILES=(
            "app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png"
            "app/src/main/res/mipmap-mdpi/ic_launcher_background.png"
            "app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png"
            "app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png"
            "app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
            "app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png"
            "app/src/main/res/mipmap-xxhdpi/ic_launcher_monochrome.png"
            "app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png"
            "app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png"
            "app/src/main/res/mipmap-xhdpi/ic_launcher_monochrome.png"
            "app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png"
            "app/src/main/res/mipmap-xhdpi/ic_launcher_background.png"
            "app/src/main/res/mipmap-hdpi/ic_launcher_monochrome.png"
            "app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png"
            "app/src/main/res/mipmap-hdpi/ic_launcher_background.png"
          )

          # التكرار لحذف الملفات
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              rm "$FILE"
              echo "Deleted: $FILE"
            else
              echo "File not found (skipped): $FILE"
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "chore: remove specific launcher icons [skip ci]" || echo "No changes to commit"
          git push
